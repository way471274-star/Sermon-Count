<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F2EDE2;
  --panel:#E7E0D1;
  --ink:#16242C;
  --dim:#66787F;
  --line:#D2C8B4;
  --accent:#9A5F1E;
  --over:#A33522;
  --ahead:#3E6B48;
  --btn:#DFD6C3;
  --btn-ink:#16242C;
  --warn-bg:#F7E9C9;
  --warn-ink:#4A3305;
  --over-bg:#F3D6CD;
  --over-ink:#4C1409;
  --shell:720px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#152229; --panel:#1D2F39; --ink:#EFE6D4; --dim:#8DA4B0; --line:#2C4553;
    --accent:#E8B45C; --over:#E0765C; --ahead:#8FBE93;
    --btn:#243946; --btn-ink:#EFE6D4;
    --warn-bg:#3A2E14; --warn-ink:#F6DFA6;
    --over-bg:#3E1A13; --over-ink:#FBD4C7;
  }
}
:root[data-theme="dark"]{
  --bg:#152229; --panel:#1D2F39; --ink:#EFE6D4; --dim:#8DA4B0; --line:#2C4553;
  --accent:#E8B45C; --over:#E0765C; --ahead:#8FBE93;
  --btn:#243946; --btn-ink:#EFE6D4;
  --warn-bg:#3A2E14; --warn-ink:#F6DFA6;
  --over-bg:#3E1A13; --over-ink:#FBD4C7;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease,color .5s ease;
  overflow:hidden;
}
body.warn{background:var(--warn-bg);color:var(--warn-ink)}
body.over{background:var(--over-bg);color:var(--over-ink)}
body.warn,body.over{--dim:currentColor;--line:currentColor}
body.warn .seg-fill,body.over .seg-fill{opacity:.85}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- shell ---------- */
.shell{
  height:100%;
  max-width:var(--shell);
  margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:10px;
}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;gap:14px}
.now{
  font-stretch:78%;
  font-weight:700;
  font-size:clamp(17px,4.4vw,26px);
  letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.count{margin-left:auto;font-stretch:70%;font-weight:500;font-size:14px;opacity:.7;white-space:nowrap}
.icons{display:flex;gap:2px;margin-left:4px}
.icon{padding:6px 8px;font-stretch:70%;font-weight:600;font-size:13px;opacity:.65;border-radius:3px}
.icon:hover{opacity:1;background:var(--panel)}

/* ---------- hero ---------- */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.hero{
  font-weight:700;
  font-stretch:100%;
  font-size:clamp(76px,26vw,230px);
  line-height:.82;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.hero.idle{opacity:.45}
.pace{
  margin-top:clamp(8px,2vh,20px);
  font-stretch:72%;font-weight:600;
  font-size:clamp(15px,3.6vw,22px);
  letter-spacing:.01em;
  color:var(--accent);
}
.pace.good{color:var(--ahead)}
.pace.bad{color:var(--over)}
body.warn .pace,body.over .pace{color:currentColor;opacity:.8}

/* ---------- plan bar ---------- */
.plan{display:flex;gap:4px;align-items:stretch}
.seg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.seg-track{height:11px;background:var(--line);opacity:.35;position:relative;overflow:hidden;border-radius:1px}
.seg.active .seg-track,.seg.done .seg-track{opacity:.5}
.seg-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);transition:width .25s linear;border-radius:1px}
.seg.active .seg-fill{background:var(--accent)}
.seg.spill .seg-fill{background:var(--over)}
.seg-name{
  font-stretch:68%;font-weight:500;font-size:12px;opacity:.55;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg.active .seg-name{opacity:1;font-weight:700}
.totals{display:flex;justify-content:space-between;font-stretch:70%;font-weight:500;font-size:13px;opacity:.65;margin-top:2px}

/* ---------- controls ---------- */
.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.btn{
  background:var(--btn);color:var(--btn-ink);
  padding:clamp(14px,2.4vh,20px) 8px;
  font-stretch:74%;font-weight:700;font-size:clamp(14px,3.4vw,17px);
  border-radius:4px;
  transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.3;cursor:default}
.btn.go{background:var(--ink);color:var(--bg)}
body.warn .btn,body.over .btn{background:rgba(127,127,127,.18)}
body.warn .btn.go,body.over .btn.go{background:currentColor;color:var(--bg)}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;inset:0;background:var(--bg);z-index:20;
  display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
}
.sheet.open{display:flex}
.sheet-inner{max-width:var(--shell);width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.sheet h2{font-stretch:78%;font-weight:700;font-size:22px;margin-bottom:2px}
.sheet .sub{font-stretch:72%;font-weight:400;font-size:14px;opacity:.6;margin-bottom:16px}
.rows{overflow-y:auto;flex:1;min-height:0;margin:0 -4px;padding:0 4px}
.row{display:grid;grid-template-columns:1fr 78px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row input{
  font:inherit;font-stretch:76%;font-weight:600;font-size:16px;
  background:transparent;color:var(--ink);border:none;
  padding:9px 2px;width:100%;
}
.row input.mins{text-align:right;font-variant-numeric:tabular-nums}
.row .unit{font-stretch:70%;font-size:13px;opacity:.5;margin-left:-4px}
.row .kill{padding:8px 6px;opacity:.45;font-size:15px}
.row .kill:hover{opacity:1;color:var(--over)}
.minswrap{display:flex;align-items:baseline;gap:2px;border-bottom:1px solid transparent}
.sheet-foot{padding-top:14px;display:flex;flex-direction:column;gap:12px}
.tally{display:flex;justify-content:space-between;font-stretch:72%;font-weight:600;font-size:15px}
.tally span{opacity:.6;font-weight:500}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--panel);padding:8px 12px;border-radius:3px;
  font-stretch:70%;font-weight:600;font-size:13px;
}
.chip:hover{filter:brightness(1.08)}
.opts{display:flex;flex-direction:column;gap:10px;font-stretch:72%;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;cursor:pointer}
.opt input{width:17px;height:17px;accent-color:var(--accent)}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- debrief ---------- */
.debrief{overflow-y:auto;flex:1;min-height:0}
.dline{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-stretch:72%;font-size:15px;align-items:baseline}
.dline .planned{opacity:.5;font-size:13px}
.dline .delta{font-weight:700;min-width:62px;text-align:right}
.dline .delta.up{color:var(--over)}
.dline .delta.down{color:var(--ahead)}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-stretch:76%;font-weight:700;font-size:22px}

/* ---------- landscape / short screens ---------- */
@media (max-height:520px) and (orientation:landscape){
  :root{--shell:1000px}
  .shell{grid-template-rows:auto 1fr auto;grid-template-columns:1fr 210px;gap:8px 22px;padding-top:8px}
  .top{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .hero{font-size:clamp(64px,15vw,150px)}
  .planwrap{grid-column:1;grid-row:3}
  .controls{grid-column:2;grid-row:2/4;grid-template-columns:1fr;align-content:center;align-self:center}
  .btn{padding:16px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="shell" id="run">
  <div class="top">
    <div class="now" id="secName">Introduction</div>
    <div class="count" id="secCount">1 of 4</div>
    <div class="icons">
      <button class="icon" id="btnEdit" title="Edit the plan (E)">Plan</button>
      <button class="icon" id="btnTheme" title="Switch light and dark">Light</button>
      <button class="icon" id="btnFull" title="Full screen (F)">Full</button>
    </div>
  </div>

  <div class="stage">
    <div class="hero idle" id="hero">5:00</div>
    <div class="pace" id="pace">Ready when you are</div>
  </div>

  <div class="planwrap">
    <div class="plan" id="plan"></div>
    <div class="totals">
      <div id="elapsed">0:00 gone</div>
      <div id="left">40:00 of message left</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnBack">Back</button>
    <button class="btn go" id="btnGo">Start</button>
    <button class="btn" id="btnNext">Next</button>
  </div>
</main>

<!-- plan editor -->
<section class="sheet" id="sheetEdit" aria-hidden="true">
  <div class="sheet-inner">
    <h2>Message plan</h2>
    <div class="sub">Name each movement and give it minutes. The clock keeps them in this order.</div>
    <div class="rows" id="rows"></div>
    <div class="sheet-foot">
      <div class="tally"><span>Total</span><div id="tally">40 minutes</div></div>
      <button class="chip" id="btnAdd" style="align-self:flex-start">Add a section</button>
      <div class="presets" id="presets"></div>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="optAuto"> Move to the next section on its own</label>
        <label class="opt"><input type="checkbox" id="optBuzz"> Buzz the phone at one minute left and at time</label>
      </div>
      <div class="sheet-btns">
        <button class="btn" id="btnCancel">Cancel</button>
        <button class="btn go" id="btnSave">Save plan</button>
      </div>
    </div>
  </div>
</section>

<!-- debrief -->
<section class="sheet" id="sheetDone" aria-hidden="true">
  <div class="sheet-inner">
    <h2>How it went</h2>
    <div class="sub">Planned time against what you actually took.</div>
    <div class="debrief" id="debrief"></div>
    <div class="sheet-foot">
      <div class="dtotal"><div>Total</div><div id="dTotal">0:00</div></div>
      <div class="sheet-btns">
        <button class="btn" id="btnDoneEdit">Edit plan</button>
        <button class="btn go" id="btnAgain">Start over</button>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };

/* ---------------- storage ---------------- */
var KEY = "pulpitclock:v1";
function load(){
  try{ var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({plan:plan, opts:opts, theme:document.documentElement.getAttribute("data-theme")})); }
  catch(e){}
}

var TEMPLATES = [
  {label:"40 min · 5/15/15/5", sections:[
    {name:"Introduction",mins:5},{name:"Point one",mins:15},{name:"Point two",mins:15},{name:"Application",mins:5}]},
  {label:"30 min · 4/10/10/6", sections:[
    {name:"Introduction",mins:4},{name:"Point one",mins:10},{name:"Point two",mins:10},{name:"Call to respond",mins:6}]},
  {label:"45 min · three points", sections:[
    {name:"Introduction",mins:5},{name:"Point one",mins:12},{name:"Point two",mins:12},{name:"Point three",mins:11},{name:"Application",mins:5}]},
  {label:"20 min · short word", sections:[
    {name:"Opening",mins:3},{name:"The text",mins:12},{name:"Close",mins:5}]}
];

var saved = load() || {};
var plan = (saved.plan && saved.plan.length) ? saved.plan : TEMPLATES[0].sections.map(function(s){ return {name:s.name, mins:s.mins}; });
var opts = Object.assign({auto:false, buzz:true}, saved.opts || {});
if(saved.theme) document.documentElement.setAttribute("data-theme", saved.theme);

/* ---------------- run state ---------------- */
var run = { going:false, elapsed:0, last:0, starts:[0], idx:0, done:false, endAt:0, warned:{}, belled:{} };
var ticker = null, wakeLock = null;

function plannedMs(i){ return Math.max(0, plan[i].mins) * 60000; }
function totalPlanned(){ var t=0; for(var i=0;i<plan.length;i++) t+=plannedMs(i); return t; }
function cumBefore(i){ var t=0; for(var k=0;k<i;k++) t+=plannedMs(k); return t; }
function sectionStart(){ return run.starts[run.idx] || 0; }
function actual(i){
  var end = (i < run.starts.length-1) ? run.starts[i+1] : (run.done ? run.endAt : run.elapsed);
  if(i >= run.starts.length) return null;
  return end - run.starts[i];
}

/* ---------------- formatting ---------------- */
function fmt(ms){
  var neg = ms < 0; ms = Math.abs(ms);
  var t = Math.floor(ms/1000);
  var h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  var pad = function(n){ return n<10 ? "0"+n : ""+n; };
  var core = h > 0 ? (h + ":" + pad(m) + ":" + pad(s)) : (m + ":" + pad(s));
  return (neg ? "-" : "") + core;
}
function loose(ms){
  var mins = Math.round(Math.abs(ms)/60000);
  if(mins < 1) return "under a minute";
  return mins + (mins === 1 ? " minute" : " minutes");
}

/* ---------------- clock ---------------- */
function start(){
  if(run.done) return;
  run.going = true;
  run.last = Date.now();
  if(!ticker) ticker = setInterval(tick, 120);
  wake();
  draw();
}
function pause(){
  if(run.going){ run.elapsed += Date.now() - run.last; }
  run.going = false;
  if(ticker){ clearInterval(ticker); ticker = null; }
  release();
  draw();
}
function tick(){
  var now = Date.now();
  run.elapsed += now - run.last;
  run.last = now;
  checkBells();
  if(opts.auto && !run.done){
    var rem = plannedMs(run.idx) - (run.elapsed - sectionStart());
    if(rem <= 0) next(true);
  }
  draw();
}
function next(auto){
  if(run.done) return;
  buzz(auto ? [90,60,90] : [40]);
  if(run.idx >= plan.length - 1){ finish(); return; }
  run.starts.push(run.elapsed);
  run.idx = run.starts.length - 1;
  draw();
}
function back(){
  if(run.done){ run.done = false; closeSheet($("#sheetDone")); }
  if(run.idx === 0) return;
  run.starts.pop();
  run.idx = run.starts.length - 1;
  draw();
}
function finish(){
  run.endAt = run.elapsed;
  run.done = true;
  run.going = false;
  if(ticker){ clearInterval(ticker); ticker = null; }
  release();
  buzz([160,90,160]);
  showDebrief();
  draw();
}
function reset(){
  run = { going:false, elapsed:0, last:0, starts:[0], idx:0, done:false, endAt:0, warned:{}, belled:{} };
  if(ticker){ clearInterval(ticker); ticker = null; }
  release();
  draw();
}

function buzz(pattern){
  if(!opts.buzz) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function checkBells(){
  var rem = plannedMs(run.idx) - (run.elapsed - sectionStart());
  if(rem <= 60000 && rem > 0 && !run.warned[run.idx]){ run.warned[run.idx] = true; buzz([70]); }
  if(rem <= 0 && !run.belled[run.idx]){ run.belled[run.idx] = true; buzz([140,80,140]); }
}

/* ---------------- screen wake ---------------- */
function wake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      navigator.wakeLock.request("screen").then(function(w){
        wakeLock = w;
        w.addEventListener("release", function(){ wakeLock = null; });
      }).catch(function(){});
    }
  }catch(e){}
}
function release(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && run.going) wake();
});

/* ---------------- drawing ---------------- */
var segEls = [];
function buildPlanBar(){
  var wrap = $("#plan");
  wrap.innerHTML = "";
  segEls = [];
  for(var i=0;i<plan.length;i++){
    var seg = document.createElement("div");
    seg.className = "seg";
    seg.style.flexGrow = Math.max(1, plan[i].mins);
    var track = document.createElement("div"); track.className = "seg-track";
    var fill = document.createElement("div"); fill.className = "seg-fill";
    track.appendChild(fill);
    var name = document.createElement("div"); name.className = "seg-name"; name.textContent = plan[i].name;
    seg.appendChild(track); seg.appendChild(name);
    wrap.appendChild(seg);
    segEls.push({seg:seg, fill:fill});
  }
}

function draw(){
  var i = run.idx;
  var secPlanned = plannedMs(i);
  var secElapsed = run.elapsed - sectionStart();
  var secLeft = secPlanned - secElapsed;
  var totLeft = totalPlanned() - run.elapsed;

  $("#secName").textContent = run.done ? "Message finished" : plan[i].name;
  $("#secCount").textContent = run.done ? fmt(run.endAt) + " total" : ("Section " + (i+1) + " of " + plan.length);

  var hero = $("#hero");
  hero.classList.toggle("idle", !run.going && run.elapsed === 0);
  hero.textContent = run.done ? fmt(run.endAt) : (secLeft < 0 ? "+" + fmt(-secLeft) : fmt(secLeft));

  // pace: how far off the plan you actually are
  var behind = run.elapsed - (cumBefore(i) + Math.min(secElapsed, secPlanned));
  var pace = $("#pace");
  pace.classList.remove("good","bad");
  if(run.done){
    var d = run.endAt - totalPlanned();
    pace.textContent = Math.abs(d) < 45000 ? "Landed on time" :
      (d > 0 ? loose(d) + " long" : loose(d) + " short");
    pace.classList.add(d > 45000 ? "bad" : "good");
  } else if(!run.going && run.elapsed === 0){
    pace.textContent = fmt(totalPlanned()) + " planned across " + plan.length + " sections";
  } else if(behind > 20000){
    pace.textContent = fmt(behind) + " behind the plan";
    pace.classList.add("bad");
  } else if(behind < -20000){
    pace.textContent = fmt(-behind) + " ahead of the plan";
    pace.classList.add("good");
  } else {
    pace.textContent = "On the plan";
  }

  // whole-screen state signal
  document.body.classList.toggle("warn", !run.done && secLeft <= 60000 && secLeft > 0);
  document.body.classList.toggle("over", !run.done && secLeft <= 0 && run.elapsed > 0);

  // plan bar
  for(var k=0;k<segEls.length;k++){
    var a = actual(k);
    var p = plannedMs(k);
    var pct, cls = "seg";
    if(k < i || (run.done && k <= i)){ pct = 100; cls += " done"; if(a !== null && a > p + 1000) cls += " spill"; }
    else if(k === i && !run.done){ pct = Math.min(100, (secElapsed / Math.max(1,p)) * 100); cls += " active"; if(secLeft <= 0) cls += " spill"; }
    else { pct = 0; }
    segEls[k].seg.className = cls;
    segEls[k].fill.style.width = pct + "%";
  }

  $("#elapsed").textContent = fmt(run.elapsed) + " gone";
  $("#left").textContent = totLeft < 0 ? (fmt(-totLeft) + " past the hour you planned") : (fmt(totLeft) + " of message left");

  $("#btnGo").textContent = run.done ? "Start over" : (run.going ? "Pause" : (run.elapsed > 0 ? "Resume" : "Start"));
  $("#btnNext").textContent = run.done ? "How it went" : (i >= plan.length - 1 ? "Finish" : "Next");
  $("#btnBack").disabled = (run.idx === 0 && !run.done);
}

/* ---------------- plan editor ---------------- */
var draftPlan = [];
function openEdit(){
  draftPlan = plan.map(function(s){ return {name:s.name, mins:s.mins}; });
  $("#optAuto").checked = !!opts.auto;
  $("#optBuzz").checked = !!opts.buzz;
  renderRows();
  renderPresets();
  openSheet($("#sheetEdit"));
}
function renderRows(){
  var box = $("#rows");
  box.innerHTML = "";
  draftPlan.forEach(function(s, idx){
    var row = document.createElement("div");
    row.className = "row";

    var name = document.createElement("input");
    name.type = "text"; name.value = s.name; name.placeholder = "Name this section";
    name.addEventListener("input", function(){ draftPlan[idx].name = name.value; });

    var wrap = document.createElement("div");
    wrap.className = "minswrap";
    var mins = document.createElement("input");
    mins.type = "number"; mins.className = "mins"; mins.min = "1"; mins.max = "180"; mins.value = s.mins;
    mins.addEventListener("input", function(){
      draftPlan[idx].mins = Math.max(1, Math.min(180, parseInt(mins.value,10) || 1));
      tally();
    });
    var unit = document.createElement("span");
    unit.className = "unit"; unit.textContent = "min";
    wrap.appendChild(mins); wrap.appendChild(unit);

    var kill = document.createElement("button");
    kill.className = "kill"; kill.textContent = "Remove"; kill.title = "Remove this section";
    kill.style.fontSize = "12px"; kill.style.fontStretch = "68%";
    kill.addEventListener("click", function(){
      if(draftPlan.length <= 1) return;
      draftPlan.splice(idx,1); renderRows(); tally();
    });

    row.appendChild(name); row.appendChild(wrap); row.appendChild(kill);
    box.appendChild(row);
  });
  tally();
}
function tally(){
  var t = draftPlan.reduce(function(a,s){ return a + Math.max(0, s.mins); }, 0);
  $("#tally").textContent = t + (t === 1 ? " minute" : " minutes");
}
function renderPresets(){
  var box = $("#presets");
  box.innerHTML = "";
  TEMPLATES.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = t.label;
    b.addEventListener("click", function(){
      draftPlan = t.sections.map(function(s){ return {name:s.name, mins:s.mins}; });
      renderRows();
    });
    box.appendChild(b);
  });
}
function commitPlan(){
  plan = draftPlan.filter(function(s){ return s.mins > 0; }).map(function(s){
    return {name: (s.name || "Section").trim() || "Section", mins: Math.max(1, s.mins)};
  });
  if(!plan.length) plan = [{name:"Message", mins:30}];
  opts.auto = $("#optAuto").checked;
  opts.buzz = $("#optBuzz").checked;
  save();
  reset();
  buildPlanBar();
  closeSheet($("#sheetEdit"));
  draw();
}

/* ---------------- debrief ---------------- */
function showDebrief(){
  var box = $("#debrief");
  box.innerHTML = "";
  for(var i=0;i<plan.length;i++){
    var a = actual(i);
    if(a === null) continue;
    var p = plannedMs(i);
    var d = a - p;
    var line = document.createElement("div");
    line.className = "dline";
    var nm = document.createElement("div"); nm.textContent = plan[i].name;
    var pl = document.createElement("div"); pl.className = "planned"; pl.textContent = fmt(a) + " of " + plan[i].mins + " min";
    var dl = document.createElement("div");
    dl.className = "delta " + (d > 20000 ? "up" : (d < -20000 ? "down" : ""));
    dl.textContent = Math.abs(d) < 20000 ? "on time" : (d > 0 ? "+" + fmt(d) : "-" + fmt(-d));
    line.appendChild(nm); line.appendChild(pl); line.appendChild(dl);
    box.appendChild(line);
  }
  $("#dTotal").textContent = fmt(run.endAt) + " of " + fmt(totalPlanned());
  openSheet($("#sheetDone"));
}

/* ---------------- sheets ---------------- */
function openSheet(el){ el.classList.add("open"); el.setAttribute("aria-hidden","false"); }
function closeSheet(el){ el.classList.remove("open"); el.setAttribute("aria-hidden","true"); }
function sheetOpen(){ return document.querySelector(".sheet.open"); }

/* ---------------- wiring ---------------- */
$("#btnGo").addEventListener("click", function(){
  if(run.done){ reset(); closeSheet($("#sheetDone")); start(); return; }
  run.going ? pause() : start();
});
$("#btnNext").addEventListener("click", function(){
  if(run.done){ showDebrief(); return; }
  next(false);
});
$("#btnBack").addEventListener("click", back);
$("#btnEdit").addEventListener("click", openEdit);
$("#btnCancel").addEventListener("click", function(){ closeSheet($("#sheetEdit")); });
$("#btnSave").addEventListener("click", commitPlan);
$("#btnAdd").addEventListener("click", function(){
  draftPlan.push({name:"New section", mins:5});
  renderRows();
  var box = $("#rows"); box.scrollTop = box.scrollHeight;
});
$("#btnAgain").addEventListener("click", function(){ closeSheet($("#sheetDone")); reset(); });
$("#btnDoneEdit").addEventListener("click", function(){ closeSheet($("#sheetDone")); openEdit(); });

$("#btnTheme").addEventListener("click", function(){
  var dark = document.documentElement.getAttribute("data-theme") !== "light";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  $("#btnTheme").textContent = dark ? "Dark" : "Light";
  save();
});
$("#btnFull").addEventListener("click", function(){
  try{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
    else { document.exitFullscreen(); }
  }catch(e){}
});

document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k = e.key.toLowerCase();
  if(k === " " || k === "spacebar"){ e.preventDefault(); $("#btnGo").click(); }
  else if(k === "n" || k === "arrowright"){ e.preventDefault(); if(!sheetOpen()) next(false); }
  else if(k === "b" || k === "arrowleft"){ e.preventDefault(); if(!sheetOpen()) back(); }
  else if(k === "r"){ if(!sheetOpen() && (run.elapsed === 0 || confirm("Clear the clock and start over?"))){ closeSheet($("#sheetDone")); reset(); } }
  else if(k === "e"){ e.preventDefault(); if(!sheetOpen()) openEdit(); }
  else if(k === "f"){ $("#btnFull").click(); }
  else if(k === "escape"){ var s = sheetOpen(); if(s) closeSheet(s); }
});

$("#btnTheme").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "Dark" : "Light";

// iPhone Safari has no element fullscreen and no vibration; say so rather than
// offering controls that quietly do nothing.
if(!document.documentElement.requestFullscreen || window.navigator.standalone){
  $("#btnFull").style.display = "none";
}
if(!navigator.vibrate){
  var buzzLabel = $("#optBuzz").parentNode;
  buzzLabel.style.opacity = ".45";
  $("#optBuzz").disabled = true;
  buzzLabel.lastChild.textContent = " Buzz at one minute left (this device can't vibrate from a web page)";
}
buildPlanBar();
draw();

// Cache the app so it opens with the network off.
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
</body>
</html>
